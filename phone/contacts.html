<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Nib contacts</title>
<style>body{font:18px system-ui;max-width:420px;margin:0 auto;padding:24px;text-align:center;background:#1d1830;color:#fff}
button,input{font-size:18px;padding:12px 16px;border-radius:12px;border:0;margin:5px;width:85%;box-sizing:border-box}button{background:#45f5c8;color:#0d0820;width:auto}
#msg{min-height:2em;color:#ffd23f}ul{list-style:none;padding:0;color:#aab}</style>
<h2>Nib contacts</h2>
<p>Press <b>Add contact</b> on Nib, then enter the code it shows.</p>
<input id=code inputmode=numeric maxlength=6 placeholder="code from Nib">
<input id=name placeholder="name, e.g. Masha"><input id=addr placeholder="0x... address">
<p><button id=go>Save contact</button></p><p id=msg></p><ul id=list></ul>
<script>
const qc = new URLSearchParams(location.search).get("code"); if (qc) document.getElementById("code").value = qc;
const $ = s => document.getElementById(s);
async function load() { const l = await (await fetch("/contacts.json")).json(); $("list").textContent = ""; for (const c of l) { const li = document.createElement("li"); li.textContent = c.name + " - " + c.address; $("list").append(li); } }
$("go").onclick = async () => { const r = await fetch("/contacts.json", { method: "POST", body: JSON.stringify({ code: $("code").value.trim(), name: $("name").value.trim(), address: $("addr").value.trim() }) }); const j = await r.json(); $("msg").textContent = r.ok ? "Saved!" : j.error; if (r.ok) { $("name").value = $("addr").value = ""; load(); } };
load();
</script>
