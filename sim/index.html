function drawWeather(){if(!wx)return;const c=wx.code;x.save();x.translate(24,350);   // tiny weather icon + temperature in the bottom-left corner
 const cloud=col=>{x.fillStyle=col;x.beginPath();x.arc(-5,2,5,0,7);x.arc(1,-2,6,0,7);x.arc(7,2,5,0,7);x.fill();x.fillRect(-5,2,12,5)};

 else if(c<=67||(c>=80&&c<=82)){cloud('#aab3e8');x.strokeStyle='#7fb4ff';x.lineWidth=1.8;for(let i=0;i<3;i++){x.beginPath();x.moveTo(-5+i*5,9);x.lineTo(-6+i*5,12);x.stroke()}}
 else if(c<=77){cloud('#dfe4ff');x.fillStyle='#fff';for(let i=0;i<3;i++)x.fillRect(-5+i*5,10,2,2)}

 const g=x.createRadialGradient(160,210,20,160,210,190);   // day / evening / night backdrop

let lines=[],lastSay=null,scrollT=0,shown=0;const LH=18,BOX_Y=368,BOX_H=100,HOLD=110,SPEED=0.35,CPS=1.1;
function wrapLines(t,w){const out=[];let l='';for(const wd of t.split(' ')){if(l&&x.measureText(l+wd).width>w){out.push(l.trim());l=''}l+=wd+' '}out.push(l.trim());return out}

 const old=wal.textContent;for(let i=0;i<150;i++){await new Promise(z=>setTimeout(z,2000));const o=await(await fetch('/owner')).json();const n=o.owner?o.owner.slice(0,8)+'...'+o.owner.slice(-6):'not connected';if(n!==old){wal.textContent=n;pairmsg.textContent='';setQr(null);say='Wallet connected!';state='happy';return}}}
qrmode.onchange=()=>{if(qrUrl&&!qrRaw)setQr(qrUrl)};
let topupWatch=null,lastBal=null;
topup.onclick=async()=>{const d=await(await fetch('/pocket-address')).json();if(!d.address){say='Could not get the deposit address.';state='sad';return}
 const base=(await(await fetch('/pocket')).json()).balanceUsd;topupWatch=base;setQr(d.address,true);hint='scan to top up';state='ask';
 const nets=[...new Set(d.tokens.map(t=>t.network))].join(', ');say='To add money to my pocket, send USDC or USDT on '+nets+' to this address. Keep it under $'+((sm&&sm.pocket&&sm.pocket.cap)||100)+' in total. Other coins get lost.';
 pairmsg.textContent='Deposit address: '+d.address;setTimeout(()=>{if(topupWatch!==null){topupWatch=null;if(qrRaw)setQr(null)}},600000)};
setInterval(async()=>{if(topupWatch===null)return;try{const b=(await(await fetch('/pocket')).json()).balanceUsd;if(b>topupWatch+0.01){topupWatch=null;setQr(null);pairmsg.textContent='';say='Pocket topped up: $'+b.toFixed(2);state='happy';showPocket()}}catch(e){}},5000);
addc.onclick=async()=>{const r=await(await fetch('/pair-start',{method:'POST'})).json();if(!r.code){say='I need the PIN to add a contact.';state='sad';return}say='Scan this with your phone camera to add a contact.';state='ask';setQr(r.url.replace('/setup','/contacts')+'?code='+r.code,false);setTimeout(()=>{if(qrUrl&&qrUrl.includes('/contacts'))setQr(null)},300000);pairmsg.textContent='Contact code: '+r.code+' (5 min)'};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let wakeRec=null,recActive=false;
function stopWake(){const r=wakeRec;wakeRec=null;try{r&&r.stop()}catch(e){}}
function startWake(){if(!SR||!wake.checked||wakeRec||recActive)return;const r=new SR();wakeRec=r;r.lang='en-US';r.continuous=true;r.interimResults=true;
 r.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++){if(!e.results[i].isFinal)continue;const m=e.results[i][0].transcript.toLowerCase().match(/hey,? ?(buddy|bud|body|buddie|budy|buddy's)\b[,.! ]*(.*)$/);
   if(m){stopWake();idleFace='surprised';idleUntil=Date.now()+1200;const rest=m[2].trim();if(rest.length>3)ask(rest);else speak();return}}};
 r.onend=()=>{if(wakeRec===r)wakeRec=null};r.onerror=()=>{};try{r.start()}catch(e){wakeRec=null}}
setInterval(()=>{if(wake.checked&&!wakeRec&&!recActive&&state!=='thinking')startWake();if(!wake.checked&&wakeRec)stopWake()},1500);
function speakBrowser(){const r=new SR();recActive=true;stopWake();r.lang='en-US';r.interimResults=true;r.continuous=false;state='listening';hint='listening...';say='I am listening...';let got=false;
 r.onresult=e=>{const tx=[...e.results].map(z=>z[0].transcript).join(' ');say='"'+tx+'"';if(e.results[e.results.length-1].isFinal){got=true;recActive=false;ask(tx)}};
 r.onerror=e=>{recActive=false;state='sad';say=e.error==='not-allowed'?'The microphone is blocked. Allow it in the browser.':e.error==='no-speech'?'I did not hear anything.':'I could not hear you ('+e.error+').'};
 r.onend=()=>{recActive=false;if(!got&&state==='listening'){state='sad';say='I did not hear anything.'}};try{r.start()}catch(e){recActive=false}}
async function speakServer(){recActive=true;stopWake();state='listening';hint='listening...';say='I am listening...';let ctx,stream;
 try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){recActive=false;state='sad';say='The microphone is blocked. Allow it in the browser.';return}
 ctx=new AudioContext();const src=ctx.createMediaStreamSource(stream),proc=ctx.createScriptProcessor(4096,1,1),chunks=[];let quiet=0,heard=false,t0=Date.now();
 proc.onaudioprocess=ev=>{const d=new Float32Array(ev.inputBuffer.getChannelData(0));chunks.push(d);let s=0;for(const v of d)s+=v*v;const rms=Math.sqrt(s/d.length);micLevel=rms;if(rms>0.02){heard=true;quiet=0}else quiet+=d.length/ctx.sampleRate;
  if((heard&&quiet>0.9)||Date.now()-t0>8000)finish()};src.connect(proc);proc.connect(ctx.destination);
 async function finish(){proc.disconnect();src.disconnect();stream.getTracks().forEach(z=>z.stop());const rate=ctx.sampleRate;ctx.close();recActive=false;micLevel=0;
  const all=new Float32Array(chunks.reduce((n,c)=>n+c.length,0));let o=0;for(const c of chunks){all.set(c,o);o+=c.length}
  const ratio=rate/16000,out=new Int16Array(Math.floor(all.length/ratio));for(let i=0;i<out.length;i++){const v=Math.max(-1,Math.min(1,all[Math.floor(i*ratio)]));out[i]=v<0?v*0x8000:v*0x7fff}
  state='thinking';say='...';const r=await(await fetch('/voice',{method:'POST',body:out.buffer})).json();state=r.state;say=r.say;if(r.heard)say='"'+r.heard+'" - '+r.say;if(r.pendingId){poll(r.pendingId)}}}
function speak(){if(recActive)return;if(micMuted){state='sad';say='My microphone is off. Turn it on in settings.';return}if(SR&&!srv.checked)speakBrowser();else if(navigator.mediaDevices)speakServer();else{state='sad';say='This browser cannot hear me. Open the simulator in Chrome, or type.'}}
go.onclick=()=>{const v=t.value.trim();if(v){t.value='';ask(v)}else speak()};t.onkeydown=e=>e.key==='Enter'&&go.click();draw();
