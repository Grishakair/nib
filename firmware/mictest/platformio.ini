; Mic test: ES8311 codec + I2S microphone level meter on the 3.5" ES3C35P / Elecrow N16R8 board.
; Pins from the vendor page: I2C SDA38 SCL39, I2S MCLK17 BCLK18 WS21 DOUT15 DIN16, speaker amp enable IO1 (active low).
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1 -DBOARD_HAS_PSRAM
lib_deps = https://github.com/pschatzmann/arduino-audio-driver.git
