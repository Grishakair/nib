; Mic + AI test: hold BOOT, speak, release -> audio goes over Wi-Fi to the Nib server (/voice) -> Whisper -> assistant -> answer printed on the serial monitor.
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1 -DBOARD_HAS_PSRAM
lib_deps =
  https://github.com/pschatzmann/arduino-audio-driver.git
  bblanchon/ArduinoJson
