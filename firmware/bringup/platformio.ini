; Bring-up project: flash this first, read the serial report.
; The module reports 16 MB flash, so it is most likely an N16R8 (8 MB OCTAL PSRAM): memory_type qio_opi.
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1 -DBOARD_HAS_PSRAM
