; Display bring-up: ST77922 over QSPI (3.5" ES3C35P board), shows colour bands then the Nib mascot.
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1 -DBOARD_HAS_PSRAM
  -Ilib/esp_lcd_st77922/include -Ilib/esp_lcd_st77922/priv_include -I../include
  -DESP_LCD_ST77922_VER_MAJOR=1 -DESP_LCD_ST77922_VER_MINOR=0 -DESP_LCD_ST77922_VER_PATCH=0
