; Board model is a placeholder: set `board` / pins to match your exact ESP32-S3 3.5" (ILI9488/ST7796 + touch + I2S mic) once it arrives.
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
build_flags = -DBOARD_HAS_PSRAM -DUSER_SETUP_LOADED -DST7796_DRIVER -DTFT_WIDTH=320 -DTFT_HEIGHT=480
lib_deps = bodmer/TFT_eSPI, bblanchon/ArduinoJson, ricmoo/QRCode
monitor_speed = 115200
